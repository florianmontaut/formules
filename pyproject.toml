[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "formules"
description = "Formules mathématiques sur des voies de mesure : calcul numpy, unités, tables, caloporteurs"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.dynamic]
version = {attr = "formules.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
